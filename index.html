<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Deltaa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f4eddf;
  font-family:Georgia,serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* HALAMAN */
.container{
  width:100%;
  max-width:430px;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

/* KARTU */
.card{
  width:300px;
  height:540px;
  perspective:1200px;
  cursor:pointer;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transition:transform 1s;
  transform-style:preserve-3d;
}

.card.open .card-inner{
  transform:rotateY(180deg);
}

/* DEPAN */
.front,
.back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:5px;
  background:#fffdf7;
  box-shadow:
    0 10px 35px rgba(80,60,30,.18);
}

/* DEPAN KARTU */
.front{
  padding:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.top-line{
  width:100%;
  height:28px;
  margin-bottom:30px;

  background:
  repeating-linear-gradient(
    90deg,
    #e8cfd0 0px,
    #e8cfd0 14px,
    #f8e9e5 14px,
    #f8e9e5 25px
  );
}

.small{
  font-size:12px;
  letter-spacing:4px;
  color:#a78d66;
  margin-bottom:20px;
}

.title{
  font-size:30px;
  margin:5px 0;
  color:#55483f;
}

.name{
  font-size:34px;
  color:#a77b50;
  margin:10px 0 25px;
}

.photo{
  width:230px;
  height:230px;
  border-radius:12px;
  overflow:hidden;
  background:#eadfce;
  margin-bottom:20px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message{
  font-size:15px;
  color:#665b52;
  line-height:1.6;
}

.tap{
  margin-top:auto;
  font-size:13px;
  color:#9b8a76;
}

/* BELAKANG */
.back{
  transform:rotateY(180deg);
  padding:28px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.back .small{
  margin-bottom:30px;
}

.back h2{
  font-size:28px;
  font-weight:normal;
  color:#594a40;
  margin:10px 0 25px;
}

.birthday{
  font-size:22px;
  line-height:1.7;
  color:#6d5b4d;
  margin:10px 0;
}

.heart{
  font-size:45px;
  margin:20px 0;
}

.footer{
  margin-top:auto;
  font-size:13px;
  color:#a08e79;
  line-height:1.6;
}

/* TOMBOL */
.open-text{
  position:fixed;
  bottom:25px;
  font-size:14px;
  color:#867664;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" onclick="bukaKartu()">

    <div class="card-inner">

      <!-- DEPAN -->
      <div class="front">

        <div class="top-line"></div>

        <div class="small">
          SPECIAL DAY
        </div>

        <div class="title">
          HAPPY
        </div>

        <div class="name">
          DELTAA
        </div>

        <div class="photo">

          <!--
          GANTI FOTO DI SINI
          dengan nama foto kamu.
          Contoh:
          foto.jpg
          -->

          <img src="foto.jpg" alt="Deltaa">

        </div>

        <div class="message">
          happy birthday yaa deltaa 🎂
        </div>

        <div class="tap">
          ketuk kartu untuk membuka
        </div>

      </div>


      <!-- BELAKANG -->
      <div class="back">

        <div class="small">
          BIRTHDAY CARD
        </div>

        <h2>
          Happy Birthday
        </h2>

        <div class="heart">
          🎂
        </div>

        <div class="birthday">
          happy birthday yaa deltaa
          <br>
          🎉🎈🎁
        </div>

        <div class="footer">
          Semoga hari spesialmu penuh
          dengan kebahagiaan,
          tawa, dan hal-hal baik.
          <br><br>
          Jangan lupa bahagia yaa, Deltaa 🤍
        </div>

      </div>

    </div>

  </div>

</div>

<div class="open-text">
  ketuk kartu untuk membuka
</div>


<script>

function bukaKartu(){

  const kartu = document.querySelector(".card");

  kartu.classList.toggle("open");

}

</script>

</body>
</html>
